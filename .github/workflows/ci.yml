name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Formatting
        working-directory: android
        run: ./gradlew spotlessCheck --console=plain
      - name: Unit tests, lint and debug build
        working-directory: android
        run: ./gradlew testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain
      - name: Compile shared code for iOS
        # Kotlin/Native compiles iOS klibs on Linux too; only linking needs macOS.
        working-directory: android
        run: ./gradlew compileKotlinIosArm64 compileKotlinIosSimulatorArm64 --console=plain
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
          retention-days: 7

  changes:
    name: iOS changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check for changes that can break the iOS build
        id: diff
        # macOS runners are slow and scarce: pull requests build the iOS app only when they touch
        # iOS code, the Xcode project or the build setup. Pushes to main always build it; common
        # code is compiled for iOS on Linux in the Android job.
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pattern='^(iosApp/|android/.*/src/iosMain/|android/gradle/|android/gradle\.properties$|android/(.*/)?[^/]*\.gradle\.kts$|\.github/workflows/ci\.yml$)'
          if git diff --name-only "$BASE" HEAD | grep -qE "$pattern"; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  ios:
    name: iOS
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Build the iOS app for the simulator
        working-directory: iosApp
        run: >-
          xcodebuild -project iosApp.xcodeproj -target iosApp -configuration Debug
          -sdk iphonesimulator -arch arm64 CODE_SIGNING_ALLOWED=NO build

  api:
    name: Generated API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Terminal touch regression tests
        run: bun test tools/terminal-touch.test.ts
      - name: Check the iOS widget strings match the Android ones
        run: bun test tools/ios-widget-strings.test.ts
      - name: Check translation coverage and format arguments
        # Every language is required on the release pull request; elsewhere only English and Italian.
        env:
          STRICT_LOCALES: ${{ startsWith(github.head_ref, 'release-please--') && '1' || '0' }}
        run: bun test tools/locales.test.ts
      - name: Check android/core/api matches api/openapi.json
        working-directory: tools/api-gen
        run: |
          bun install --frozen-lockfile
          bun run check
