name: Release

# After every push to main, release-please keeps a "chore(release): Release x.y.z" pull request
# up to date with the next version (from the Conventional Commit titles), CHANGELOG.md and
# version.txt. Merging that pull request tags the release, publishes the GitHub Release and
# builds the signed APK attached to it.
#
# Repository secrets for signing:
#   OCM_KEYSTORE_BASE64    base64 of the release keystore (.jks)
#   OCM_KEYSTORE_PASSWORD  keystore password
#   OCM_KEY_ALIAS          key alias
#   OCM_KEY_PASSWORD       key password

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.fork }}
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  apk:
    name: Signed APK
    needs: release-please
    if: ${{ needs.release-please.outputs.created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.OCM_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::OCM_KEYSTORE_BASE64 is not set; refusing to publish a debug-signed APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build the signed APK
        working-directory: android
        env:
          OCM_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          OCM_KEYSTORE_PASSWORD: ${{ secrets.OCM_KEYSTORE_PASSWORD }}
          OCM_KEY_ALIAS: ${{ secrets.OCM_KEY_ALIAS }}
          OCM_KEY_PASSWORD: ${{ secrets.OCM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # The version name and code come from version.txt, bumped by the release PR.
          ./gradlew testDebugUnitTest :app:lintRelease :app:assembleRelease --console=plain
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/OpenCode-Mobile-$TAG.apk"
          cp app/build/outputs/mapping/release/mapping.txt "../dist/mapping-$TAG.txt"
          (cd ../dist && sha256sum -- *.apk > SHA256SUMS)

      - name: Check the signing certificate
        env:
          # SHA-256 of the release certificate (public, see apksigner verify --print-certs).
          EXPECTED_CERT: df43c2d50156cb0946bc95161fe11d4091660b5bdad2c46a499a88c4538b680a
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)"
          actual="$("$apksigner" verify --print-certs dist/*.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
          if [ "$actual" != "$EXPECTED_CERT" ]; then
            echo "::error::The APK is signed with an unexpected certificate ($actual)."
            exit 1
          fi

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
